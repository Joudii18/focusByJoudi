<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="overlay"></div>
    <div class="content">
        <div class="header">
            <div class="logo">focus</div>
            <div class="author">By Joudi</div>
        </div>

        <div class="main-container">
            <div class="session-input-container">
                <input type="text" class="session-input" id="sessionName" placeholder="Name your focus session...">
            </div>

            <div class="mode-selector">
                <button class="mode-btn active" data-mode="focus">Focus</button>
                <button class="mode-btn" data-mode="short-break">Short Break</button>
                <button class="mode-btn" data-mode="long-break">Long Break</button>
            </div>

            <div class="time-presets" id="timePresets">
                <div class="preset-option" data-minutes="15">
                    <input type="checkbox" class="preset-checkbox" id="preset15">
                    <label class="preset-label" for="preset15">15 min</label>
                </div>
                <div class="preset-option" data-minutes="25">
                    <input type="checkbox" class="preset-checkbox" id="preset25">
                    <label class="preset-label" for="preset25">25 min</label>
                </div>
                <div class="preset-option" data-minutes="30">
                    <input type="checkbox" class="preset-checkbox" id="preset30">
                    <label class="preset-label" for="preset30">30 min</label>
                </div>
                <div class="preset-option" data-minutes="45">
                    <input type="checkbox" class="preset-checkbox" id="preset45">
                    <label class="preset-label" for="preset45">45 min</label>
                </div>
                <div class="preset-option" data-minutes="60">
                    <input type="checkbox" class="preset-checkbox" id="preset60">
                    <label class="preset-label" for="preset60">60 min</label>
                </div>
            </div>

            <div class="timer-display" id="timerDisplay" contenteditable="true">25:00</div>
            <div class="timer-hint">Click the timer to type a custom time</div>

            <div class="controls">
                <button class="control-btn" id="startBtn">Start</button>
                <button class="control-btn" id="pauseBtn" style="display: none;">Pause</button>
                <button class="control-btn secondary" id="resetBtn">Reset</button>
            </div>
        </div>
    </div>

    <!-- YouTube Player Container -->
    <div class="youtube-player-container" id="youtubeContainer">
        <div class="youtube-header" id="youtubeHeader">
            <div class="youtube-header-title">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
                <span>YouTube</span>
            </div>
            <div class="youtube-controls">
                <button class="youtube-control-btn" id="toggleVideoBtn" title="Hide/Show video">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                    </svg>
                </button>
                <button class="youtube-control-btn" id="closeYoutubeBtn" title="Close player">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="youtube-content" id="youtubeContent">
            <div class="youtube-search">
                <input 
                    type="text" 
                    class="youtube-search-input" 
                    id="youtubeSearch" 
                    placeholder="Paste YouTube URL or video ID..."
                >
            </div>
            <div id="player" class="youtube-player"></div>
        </div>
    </div>

    <!-- YouTube Toggle Button -->
    <button class="youtube-toggle" id="youtubeToggle" title="Toggle YouTube player">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
    </button>

    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <!-- Main JavaScript -->
    <script src="index.js"></script>
</body>
</html>
